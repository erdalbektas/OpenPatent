name: build-installers
run-name: "Build Windows + Linux installers (v${{ inputs.version }})"

# Manually triggered – builds NSIS (.exe) and Debian (.deb) without touching
# the release or version bump flow.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "App version to embed (e.g. 1.2.16)"
        required: true
        default: "1.2.16"
        type: string

concurrency:
  group: build-installers
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  # ── Windows NSIS installer ──────────────────────────────────────────────────
  windows:
    name: Build Windows installer (.exe)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev   # build from dev branch which has the full monorepo

      - uses: ./.github/actions/setup-bun

      - name: Build CLI sidecar (Windows x64)
        run: |
          cd packages/openpatent
          bun run build --single --baseline
          mkdir -p ../desktop/src-tauri/sidecars
          cp dist/openpatent-windows-x64-baseline/bin/opencode.exe ../desktop/src-tauri/sidecars/opencode-cli-x86_64-pc-windows-msvc.exe


      - name: Build Tauri NSIS installer
        run: |
          cd packages/desktop
          bunx tauri build --bundles nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            packages/desktop/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 7

  # ── Linux .deb package ──────────────────────────────────────────────────────
  linux:
    name: Build Linux installer (.deb)
    runs-on: ubuntu-22.04   # pin to 22.04 for glibc 2.35 compat

    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev   # build from dev branch which has the full monorepo

      - uses: ./.github/actions/setup-bun

      - name: Build CLI sidecar (Linux x64)
        run: |
          cd packages/openpatent
          bun run build --single --baseline
          mkdir -p ../desktop/src-tauri/sidecars
          cp dist/openpatent-linux-x64-baseline/bin/opencode ../desktop/src-tauri/sidecars/opencode-cli-x86_64-unknown-linux-gnu


      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libssl-dev

      - name: Build Tauri .deb package
        run: |
          cd packages/desktop
          bunx tauri build --bundles deb
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload Linux .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: |
            packages/desktop/src-tauri/target/release/bundle/deb/*.deb
          retention-days: 7
