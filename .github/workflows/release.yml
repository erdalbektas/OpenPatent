name: release
run-name: "Release v${{ inputs.version }}"

# ─── Triggers ────────────────────────────────────────────────────────────────
# Run manually from the GitHub Actions UI.
# You must provide a semantic version (e.g. 1.3.0).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "New version to release (e.g. 1.3.0)"
        required: true
        type: string
        default: "1.2.18"
      draft:
        description: "Create as draft release (review before publishing)"
        required: false
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

# ─── Jobs ────────────────────────────────────────────────────────────────────
jobs:

  # ── 1. Bump version in package.json and create the GitHub Release ──────────
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
      release_id: ${{ steps.create_release.outputs.release_id }}
      upload_url: ${{ steps.create_release.outputs.upload_url }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/setup-bun

      - name: Bump version
        id: bump
        run: |
          VERSION="${{ inputs.version }}"
          # Update desktop package.json
          cd packages/desktop
          bun x -y json -I -f package.json -e "this.version='${VERSION}'"
          cd ../..
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        run: |
          VERSION="${{ steps.bump.outputs.version }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/desktop/package.json
          if git diff --staged --quiet; then
            echo "Version already at ${VERSION}"
          else
            git commit -m "release: v${VERSION}"
          fi
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists locally"
          else
            git tag "v${VERSION}"
          fi
          git push origin HEAD:dev --follow-tags

      - name: Build simple changelog
        id: changelog
        run: |
          # Collect conventional commits since the last tag (skip infra/chore)
          PREV_TAG=$(git tag --list 'v*' --sort=-version:refname | sed -n '2p')
          if [ -z "$PREV_TAG" ]; then
            RANGE="HEAD"
          else
            RANGE="${PREV_TAG}..HEAD"
          fi
          NOTES=$(git log $RANGE --pretty=format:"- %s" \
            --no-merges \
            | grep -v -E "^- (ignore:|chore:|ci:|release:)" \
            || echo "- Initial release")
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES"    >> "$GITHUB_OUTPUT"
          echo "EOF"       >> "$GITHUB_OUTPUT"

      - name: Validate sidecar contract
        run: |
          test -f packages/desktop/src-tauri/tauri.conf.json
          test -f packages/desktop/src-tauri/src/cli.rs
          grep -q '"externalBin": \["sidecars/openpatent-cli"\]' packages/desktop/src-tauri/tauri.conf.json
          grep -q '.join("openpatent-cli")' packages/desktop/src-tauri/src/cli.rs

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: "v${{ steps.bump.outputs.version }}"
          release_name: "OpenPatent v${{ steps.bump.outputs.version }}"
          body: |
            OpenPatent v${{ steps.bump.outputs.version }}

            - Unified Windows desktop bundle (bundled sidecar only, single app version)
            - Version-aligned sidecar builds across macOS, Windows, and Linux
            - Mac App Store build support and menu gating

            ${{ steps.changelog.outputs.notes }}
          draft: ${{ inputs.draft }}
          prerelease: false

  # ── 2. Build Tauri for macOS (arm64 + x86_64 universal) ───────────────────
  build-macos:
    name: Build macOS
    needs: prepare
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: "v${{ needs.prepare.outputs.version }}"

      - uses: ./.github/actions/setup-bun

      - name: Install Rust targets
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Build CLI sidecar (macOS arm64)
        env:
          RUST_TARGET: aarch64-apple-darwin
          OPENCODE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          cd packages/desktop
          bun run build:sidecar

      - name: Gate sidecar input (macOS)
        run: |
          test -x packages/desktop/src-tauri/sidecars/openpatent-cli-aarch64-apple-darwin
          packages/desktop/src-tauri/sidecars/openpatent-cli-aarch64-apple-darwin --version | grep -q "${{ needs.prepare.outputs.version }}"

      - name: Import code-signing certificate
        if: ${{ env.APPLE_CERTIFICATE != '' }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 20)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$APPLE_CERTIFICATE" | base64 --decode > /tmp/cert.p12
          security import /tmp/cert.p12 -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Build Tauri (universal macOS)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cd packages/desktop
          bunx tauri build \
            --config src-tauri/tauri.prod.conf.json \
            --target universal-apple-darwin

      - name: Gate sidecar in macOS bundle
        run: |
          test -x packages/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/OpenPatent.app/Contents/MacOS/openpatent-cli

      - name: Upload macOS DMG
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.prepare.outputs.upload_url }}
          asset_path: packages/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/OpenPatent_${{ needs.prepare.outputs.version }}_universal.dmg
          asset_name: OpenPatent_${{ needs.prepare.outputs.version }}_universal.dmg
          asset_content_type: application/octet-stream

      - name: Upload macOS updater signature
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.prepare.outputs.upload_url }}
          asset_path: packages/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/OpenPatent_${{ needs.prepare.outputs.version }}_universal.dmg.sig
          asset_name: OpenPatent_${{ needs.prepare.outputs.version }}_universal.dmg.sig
          asset_content_type: text/plain

  # ── 3. Build Tauri for Windows ─────────────────────────────────────────────
  build-windows:
    name: Build Windows
    needs: prepare
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: "v${{ needs.prepare.outputs.version }}"

      - uses: ./.github/actions/setup-bun

      - name: Build CLI sidecar (Windows x64)
        shell: bash
        env:
          RUST_TARGET: x86_64-pc-windows-msvc
          OPENCODE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          cd packages/desktop
          bun run build:sidecar --baseline

      - name: Gate sidecar input (Windows)
        shell: bash
        run: |
          test -f packages/desktop/src-tauri/sidecars/openpatent-cli-x86_64-pc-windows-msvc.exe
          packages/desktop/src-tauri/sidecars/openpatent-cli-x86_64-pc-windows-msvc.exe --version | grep -q "${{ needs.prepare.outputs.version }}"

      - name: Build Tauri (Windows NSIS installer)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cd packages/desktop
          bunx tauri build --config src-tauri/tauri.prod.conf.json

      - name: Gate sidecar in Windows installer
        shell: bash
        run: |
          file="packages/desktop/src-tauri/target/release/bundle/nsis/OpenPatent_${{ needs.prepare.outputs.version }}_x64-setup.exe"
          test -f "$file"
          7z l "$file" | grep -qi "openpatent-cli.*\\.exe"

      - name: Upload Windows installer
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.prepare.outputs.upload_url }}
          asset_path: packages/desktop/src-tauri/target/release/bundle/nsis/OpenPatent_${{ needs.prepare.outputs.version }}_x64-setup.exe
          asset_name: OpenPatent_${{ needs.prepare.outputs.version }}_x64-setup.exe
          asset_content_type: application/octet-stream

      - name: Upload Windows updater signature
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.prepare.outputs.upload_url }}
          asset_path: packages/desktop/src-tauri/target/release/bundle/nsis/OpenPatent_${{ needs.prepare.outputs.version }}_x64-setup.exe.sig
          asset_name: OpenPatent_${{ needs.prepare.outputs.version }}_x64-setup.exe.sig
          asset_content_type: text/plain

  # ── 4. Build Tauri for Linux ───────────────────────────────────────────────
  build-linux:
    name: Build Linux
    needs: prepare
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: "v${{ needs.prepare.outputs.version }}"

      - uses: ./.github/actions/setup-bun

      - name: Build CLI sidecar (Linux x64)
        env:
          RUST_TARGET: x86_64-unknown-linux-gnu
          OPENCODE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          cd packages/desktop
          bun run build:sidecar --baseline

      - name: Gate sidecar input (Linux)
        run: |
          test -x packages/desktop/src-tauri/sidecars/openpatent-cli-x86_64-unknown-linux-gnu
          packages/desktop/src-tauri/sidecars/openpatent-cli-x86_64-unknown-linux-gnu --version | grep -q "${{ needs.prepare.outputs.version }}"

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libgtk-3-dev libssl-dev

      - name: Build Tauri (Debian + AppImage)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cd packages/desktop
          bunx tauri build \
            --config src-tauri/tauri.prod.conf.json \
            --bundles deb,appimage

      - name: Gate sidecar in Linux .deb
        run: |
          file="packages/desktop/src-tauri/target/release/bundle/deb/open-patent_${{ needs.prepare.outputs.version }}_amd64.deb"
          test -f "$file"
          dpkg-deb -c "$file" | awk '{print $6}' | grep -Eq '^(\./)?usr/bin/openpatent-cli$'

      - name: Upload Linux .deb
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.prepare.outputs.upload_url }}
          asset_path: packages/desktop/src-tauri/target/release/bundle/deb/open-patent_${{ needs.prepare.outputs.version }}_amd64.deb
          asset_name: OpenPatent_${{ needs.prepare.outputs.version }}_amd64.deb
          asset_content_type: application/octet-stream

      - name: Upload Linux AppImage
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.prepare.outputs.upload_url }}
          asset_path: packages/desktop/src-tauri/target/release/bundle/appimage/open-patent_${{ needs.prepare.outputs.version }}_amd64.AppImage
          asset_name: OpenPatent_${{ needs.prepare.outputs.version }}_amd64.AppImage
          asset_content_type: application/octet-stream

      - name: Upload Linux AppImage signature
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.prepare.outputs.upload_url }}
          asset_path: packages/desktop/src-tauri/target/release/bundle/appimage/open-patent_${{ needs.prepare.outputs.version }}_amd64.AppImage.sig
          asset_name: OpenPatent_${{ needs.prepare.outputs.version }}_amd64.AppImage.sig
          asset_content_type: text/plain

  # ── 5. Publish latest.json for the Tauri in-app updater ───────────────────
  publish-updater:
    name: Publish updater manifest
    needs: [prepare, build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: "v${{ needs.prepare.outputs.version }}"

      - name: Download all release signatures
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION:  ${{ needs.prepare.outputs.version }}
          TAG:      ${{ needs.prepare.outputs.tag }}
          REPO:     ${{ github.repository }}
        run: |
          mkdir -p /tmp/sigs
          # Fetch .sig files from the GitHub release
          gh release download "$TAG" \
            --repo "$REPO" \
            --pattern "*.sig" \
            --dir /tmp/sigs

          MACOS_SIG=$(cat "/tmp/sigs/OpenPatent_${VERSION}_universal.dmg.sig" 2>/dev/null || echo "")
          WIN_SIG=$(cat   "/tmp/sigs/OpenPatent_${VERSION}_x64-setup.exe.sig" 2>/dev/null || echo "")
          LINUX_SIG=$(cat "/tmp/sigs/OpenPatent_${VERSION}_amd64.AppImage.sig" 2>/dev/null || echo "")
          BASE="https://github.com/${REPO}/releases/download/${TAG}"
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          cat > /tmp/latest.json <<EOF
          {
            "version": "${VERSION}",
            "notes": "See the release page for full changelog.",
            "pub_date": "${PUB_DATE}",
            "platforms": {
              "darwin-universal": {
                "url": "${BASE}/OpenPatent_${VERSION}_universal.dmg",
                "signature": "${MACOS_SIG}"
              },
              "windows-x86_64": {
                "url": "${BASE}/OpenPatent_${VERSION}_x64-setup.exe",
                "signature": "${WIN_SIG}"
              },
              "linux-x86_64": {
                "url": "${BASE}/OpenPatent_${VERSION}_amd64.AppImage",
                "signature": "${LINUX_SIG}"
              }
            }
          }
          EOF

      - name: Upload latest.json to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release upload "$TAG" /tmp/latest.json \
            --repo "${{ github.repository }}" \
            --clobber

      - name: Publish release (remove draft)
        if: ${{ !inputs.draft }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release edit "$TAG" --draft=false \
            --repo "${{ github.repository }}"
